name: Diagnose GitHub OIDC claims

on:
  push:
    branches: [ops/diagnose-aws-oidc]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Decode selected OIDC claims only
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          jwt="$(jq -r '.value' <<<"$response")"
          payload="$(cut -d. -f2 <<<"$jwt")"
          python3 - "$payload" <<'PY'
          import base64, json, sys
          s=sys.argv[1]
          s += '=' * (-len(s) % 4)
          d=json.loads(base64.urlsafe_b64decode(s.encode()))
          for k in ['iss','aud','sub','repository','repository_owner','ref','ref_type','event_name','workflow','job_workflow_ref','environment']:
              if k in d:
                  print(f'{k}={d[k]}')
          PY
