name: Create operator account

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email address for the new account
        required: true
      role:
        description: Role to grant
        type: choice
        options: [owner, admin, operator, analyst, viewer]
        default: operator
      environment:
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Invite the user and assign the role
        env:
          EMAIL: ${{ inputs.email }}
          ROLE: ${{ inputs.role }}
        run: |
          set -euo pipefail
          npm install --no-save firebase-admin@^14.3.0
          node .github/scripts/create-operator.mjs
