name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://apex:apex@localhost:5432/apex_test
      DATABASE_CA_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations to the test database
        run: |
          set -euo pipefail
          for f in db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          PGPASSWORD: apex

      - name: Build workspace packages
        run: |
          npm run build -w @apex/core
          npm run build -w @apex/agent-runtime
          npm run build -w @apex/workflow-engine
          npm run build -w @apex/youtube

      - name: Typecheck services
        run: npx tsc -b services/orchestrator services/agent-aria services/agent-atlas services/agent-sentinel services/agent-archivist services/agent-warden

      - name: Unit tests
        run: |
          node --test packages/core/test/*.test.mjs
          node --test packages/workflow-engine/test/*.test.mjs
          node --test packages/agent-runtime/test/*.test.mjs

      - name: Build dashboard
        run: npm run build -w @apex/dashboard

      - name: Build active Cloud Run container
        run: docker build -f services/orchestrator/Dockerfile -t apex-stream-orchestrator:pr .
