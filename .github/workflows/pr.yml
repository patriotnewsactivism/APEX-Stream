name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build workspace packages
        run: |
          npm run build -w @apex/core
          npm run build -w @apex/agent-runtime
          npm run build -w @apex/workflow-engine
          npm run build -w @apex/youtube

      - name: Typecheck services
        run: npx tsc -b services/orchestrator services/agent-aria services/agent-atlas services/agent-sentinel services/agent-archivist services/agent-warden

      - name: Unit tests
        run: |
          node --test packages/core/test/*.test.mjs
          node --test packages/workflow-engine/test/*.test.mjs

      - name: Build dashboard
        run: npm run build -w @apex/dashboard

      - name: Build active Cloud Run container
        run: docker build -f services/orchestrator/Dockerfile -t apex-stream-orchestrator:pr .
