name: Prune retired infra lock entry once

on:
  push:
    branches: [fix/cloud-run-production-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloud-run-production-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prune lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm prune --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Commit lockfile and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prune-retired-infra-lock-once.yml
          git config user.name "Matthew Reardon"
          git config user.email "patriotnewsactivism@proton.me"
          git add package-lock.json .github/workflows/prune-retired-infra-lock-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: prune retired infra lock entry"
          git push origin HEAD:fix/cloud-run-production-hardening
