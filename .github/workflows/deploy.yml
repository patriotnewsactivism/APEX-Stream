name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: Skip database migrations
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-apex
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: apex
  ARTIFACT_REPO: apex-stream

jobs:
  test:
    name: Build and test packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and test
        run: |
          npm run build -w @apex/core
          npm run build -w @apex/agent-runtime
          npm run build -w @apex/workflow-engine
          node --test packages/core/test/*.test.mjs
          node --test packages/workflow-engine/test/*.test.mjs

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push container image
        id: build
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/orchestrator"
          TAG=${{ needs.test.outputs.image_tag }}
          docker build \
            --file services/orchestrator/Dockerfile \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ steps.build.outputs.image }} \
            --project=${{ env.GCP_PROJECT }} \
            --region=${{ env.GCP_REGION }} \
            --port=8080 \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=10 \
            --memory=2Gi \
            --cpu=2 \
            --timeout=300 \
            --no-traffic \
            --tag=canary-${{ needs.test.outputs.image_tag }} \
            --update-env-vars "EVENT_BUS_NAME=apex-events,QUEUE_URL_ARIA=https://sqs.us-east-1.amazonaws.com/000000000000/apex-aria,QUEUE_URL_ATLAS=https://sqs.us-east-1.amazonaws.com/000000000000/apex-atlas,QUEUE_URL_SENTINEL=https://sqs.us-east-1.amazonaws.com/000000000000/apex-sentinel,QUEUE_URL_ARCHIVIST=https://sqs.us-east-1.amazonaws.com/000000000000/apex-archivist,QUEUE_URL_WARDEN=https://sqs.us-east-1.amazonaws.com/000000000000/apex-warden,EVIDENCE_BUCKET=apex-evidence,MEMORY_TABLE=apex-memory,KMS_KEY_ID=alias/apex-key,COGNITO_USER_POOL_ID=us-east-1_000000000,COGNITO_CLIENT_ID=0000000000000000000,DATABASE_CA_REQUIRED=false" \
            --format=json > deploy-output.json
          echo "Deployed new revision (no traffic yet)"

      - name: Route traffic to new revision
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --project=${{ env.GCP_PROJECT }} \
            --region=${{ env.GCP_REGION }} \
            --to-latest
          echo "Traffic routed to latest revision"

      - name: Verify deployment
        run: |
          sleep 20
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project=${{ env.GCP_PROJECT }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          for i in 1 2 3 4 5; do
            if curl -sf "$URL/health" > /dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              curl -sf "$URL/health" | head -10
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting..."
            sleep 10
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1
