name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apex-stream
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: ${{ vars.APEX_STREAM_CLOUD_RUN_SERVICE }}
  DEPLOY_ENABLED: ${{ vars.APEX_STREAM_DEPLOY_ENABLED }}
  ARTIFACT_REPO: apex-stream

jobs:
  test:
    name: Build and test packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and test
        run: |
          npm run build -w @apex/core
          npm run build -w @apex/agent-runtime
          npm run build -w @apex/workflow-engine
          npm run build -w @apex/youtube
          npm run build -w @apex/orchestrator
          node --test packages/core/test/*.test.mjs
          node --test packages/workflow-engine/test/*.test.mjs

      - id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Update verified APEX-Stream Cloud Run service
    needs: test
    if: vars.APEX_STREAM_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate fail-closed deployment target
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT GCP_REGION SERVICE_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required APEX-Stream deployment setting: $name" >&2
              exit 2
            fi
          done
          if [[ "$SERVICE_NAME" == "apex" ]]; then
            echo "Refusing to deploy APEX-Stream into the main APEX Cloud Run service 'apex'." >&2
            exit 3
          fi
          if [[ "$DEPLOY_ENABLED" != "true" ]]; then
            echo "APEX-Stream deployment is not explicitly enabled." >&2
            exit 3
          fi

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify exact existing service
        id: target
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --platform managed \
            --format=json)" || {
              echo "Configured APEX-Stream Cloud Run service does not exist. This workflow never creates services." >&2
              exit 4
            }
          ready="$(jq -r '.status.latestReadyRevisionName // empty' <<<"$service_json")"
          current_image="$(jq -r '.spec.template.spec.containers[0].image // empty' <<<"$service_json")"
          if [[ -z "$ready" || -z "$current_image" ]]; then
            echo "Configured service is not a verified Ready Cloud Run target." >&2
            exit 4
          fi
          echo "Verified existing APEX-Stream target: $GCP_PROJECT / $GCP_REGION / $SERVICE_NAME"

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPO}/orchestrator:${{ needs.test.outputs.image_tag }}"
          docker build --file services/orchestrator/Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update only the existing Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE_NAME" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --platform managed \
            --image "${{ steps.build.outputs.image }}" \
            --update-env-vars "APEX_VERSION=$GITHUB_SHA,APEX_ENV=prod" \
            --quiet

      - name: Verify Ready revision and live SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            service_json="$(gcloud run services describe "$SERVICE_NAME" \
              --project "$GCP_PROJECT" \
              --region "$GCP_REGION" \
              --platform managed \
              --format=json)"
            created="$(jq -r '.status.latestCreatedRevisionName // empty' <<<"$service_json")"
            ready="$(jq -r '.status.latestReadyRevisionName // empty' <<<"$service_json")"
            if [[ -n "$created" && "$created" == "$ready" ]]; then
              break
            fi
            sleep 5
          done

          URL="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --platform managed \
            --format='value(status.url)')"
          body="$(curl -fsS --retry 5 --retry-delay 3 --max-time 20 "${URL%/}/health")"
          live_sha="$(jq -r '.version // empty' <<<"$body")"
          if [[ "$live_sha" != "$GITHUB_SHA" ]]; then
            echo "Live APEX-Stream SHA mismatch. expected=$GITHUB_SHA actual=$live_sha" >&2
            exit 5
          fi
          echo "APEX-Stream release verified at $URL with SHA $live_sha"
