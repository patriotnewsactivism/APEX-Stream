name: Diagnose Cloud Run runtime once

on:
  push:
    branches: [fix/cloud-run-production-hardening]
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Identify existing service candidates without secret values
        shell: bash
        run: |
          set -euo pipefail
          for service in apex island-king-pc; do
            echo "=== $service ==="
            gcloud run services describe "$service" \
              --project "$GCP_PROJECT" \
              --region "$GCP_REGION" \
              --format=json > "${service}.json"
            jq '{
              name:.metadata.name,
              labels:.metadata.labels,
              annotations:(.metadata.annotations | with_entries(select(.key | test("source|build|client|creator|lastModifier"; "i")))),
              url:.status.url,
              latestReadyRevision:.status.latestReadyRevisionName,
              image:.spec.template.spec.containers[0].image,
              command:.spec.template.spec.containers[0].command,
              args:.spec.template.spec.containers[0].args,
              envNames:[.spec.template.spec.containers[0].env[]?.name]
            }' "${service}.json"
          done
