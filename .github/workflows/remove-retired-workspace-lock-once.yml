name: Remove retired workspace lock record once

on:
  push:
    branches: [fix/cloud-run-production-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloud-run-production-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove only retired local workspace records
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          delete lock.packages?.infra;
          delete lock.packages?.['node_modules/@apex/infra'];
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
          npm ci --ignore-scripts
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-retired-workspace-lock-once.yml
          git config user.name "Matthew Reardon"
          git config user.email "patriotnewsactivism@proton.me"
          git add package-lock.json .github/workflows/remove-retired-workspace-lock-once.yml
          git commit -m "chore: remove retired infra workspace lock record"
          git push origin HEAD:fix/cloud-run-production-hardening
